version: 2
# Version updates are intentionally disabled for this fork: `open-pull-requests-limit: 0`
# stops Dependabot from opening (and re-opening, and emailing about) version-bump PRs.
# Security updates are a separate setting on the repository itself and are unaffected
# by this file. Stale version bumps are handled manually when we next sync upstream.
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/ui"
      - "/apps/desktop"
      - "/src/context/memory/edgeclaw-memory-core"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 0

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 0
