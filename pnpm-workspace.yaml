packages:
  - 'ui'
  # Hippo's verbatim-retention policy, extracted so consumers import a package
  # rather than reach into the tree by deep relative path. Linked with
  # `workspace:*` rather than `file:` on purpose: `file:` snapshots the
  # directory at install time, so later edits to the source would silently keep
  # running the bytes captured by the last install.
  - 'src/context/compaction/retention'

allowBuilds:
  '@google/genai': true
  bcrypt: true
  better-sqlite3: true
  esbuild: true
  node-pty: true
  protobufjs: true
  sharp: true
  onnxruntime-node: true
  unrs-resolver: true

# Native/build-time packages that are allowed to run lifecycle scripts during
# pnpm install. Keeping this at the workspace root makes Docker/CI installs
# deterministic and prevents ERR_PNPM_IGNORED_BUILDS failures.
onlyBuiltDependencies:
  - '@google/genai'
  - bcrypt
  - better-sqlite3
  - esbuild
  - node-pty
  - protobufjs
  - sharp
  - onnxruntime-node
  - unrs-resolver
